[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hawk-eye"
version = "0.1.0"
description = "Local-first IDS ML pipeline (M1-friendly)."
readme = "README.md"
requires-python = ">=3.11,<3.14.4"
dependencies = [
  "numpy==2.2.3",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "joblib==1.4.2",
  "pyarrow>=15.0.0",
  "torch>=2.2.0",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "prometheus-client>=0.20.0",
  "argon2-cffi>=23.1.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "kaggle==1.6.17",
  "httpx>=0.28.0",
  "websockets>=13.0",
]
benchmark = [
  "lightgbm>=4.3.0",
  "xgboost>=2.0.0",
]
optuna = [
  "optuna>=3.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

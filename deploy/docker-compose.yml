# Local/dev stack: API only. Mount repo for data/ and artifacts; run the React app on the host (npm run dev).
# Zeek is usually installed on the host — see docs/ZEEK_REPLAY.md.
services:
  hawk-eye-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - HAWK_EYE_CORS_ORIGINS=http://127.0.0.1:5173,http://localhost:5173
    volumes:
      - ../data:/app/data
      - ../artifacts:/app/artifacts
      - ../config:/app/config:ro
    working_dir: /app
